version: '3.8'

services:
  web:
    image: ghcr.io/beta-dev64/betabevsurvey:latest
    container_name: flask_backend
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./static/uploads:/app/static/uploads
      
    environment:
      - FLASK_ENV=production
      - DATABASE_PATH=/app/data/dangote_execution.db


      